name: Bug report / 錯誤回報
description: Something doesn't work in the latest release. / 最新版有東西無法運作
body:
  - type: input
    id: version
    attributes:
      label: Version / 版本號
      description: Shown on the Settings page, or in the download file name. / 設定頁或下載檔名上可看到
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Linux x86_64 (tarball)
        - Windows x86_64 (zip)
        - Docker / Podman
        - Docker Desktop on macOS
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / 發生的情況
      description: Steps to reproduce, what you expected, and any error text. / 重現步驟、預期結果與錯誤訊息
    validations:
      required: true
