name: Bug report
description: Something doesn't work in the latest release.
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the Settings page, or in the download file name.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64 (tarball)
        - Windows x86_64 (zip)
        - Docker / Podman
        - Docker Desktop on macOS
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and any error text.
    validations:
      required: true
