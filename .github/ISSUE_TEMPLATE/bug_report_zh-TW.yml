name: 錯誤回報（繁體中文）
description: 最新版有功能無法正常運作。
body:
  - type: input
    id: version
    attributes:
      label: 版本號
      description: 可於設定頁或下載檔名查得。
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 執行環境
      options:
        - Linux x86_64（tarball）
        - Windows x86_64（zip）
        - Docker / Podman
        - macOS 上的 Docker Desktop
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 發生的情況
      description: 請填寫重現步驟、預期結果與錯誤訊息。
    validations:
      required: true
